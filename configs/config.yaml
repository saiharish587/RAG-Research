# SLM RAG Benchmark Configuration

# Experimental Parameters
experiment:
  runs_per_config: 10
  seed: 42
  metrics:
    - answer_accuracy
    - context_utilization
    - precision_at_k
    - recall_at_k
    - hallucination_rate
    - latency
    - memory_usage

# Document Processing
chunking:
  chunk_size: 1500
  chunk_overlap: 150

# Embedding Configuration
embedding:
  model_name: "BAAI/bge-small-en-v1.5"
  device: "cuda"  # or "cuda"

# Vector Database
vector_db:
  provider: "faiss"
  path: "vector_db/faiss_index"
  documents_dir: "notebooks_pruned"


models:
  - name: "hf.co/LiquidAI/LFM2-350M-GGUF:Q4_K_M"
    display_name: "LFM2 350M"
  - name: "hf.co/LiquidAI/LFM2-700M-GGUF:Q4_K_M"
    display_name: "LFM2 700M"

# Retrieval Configurations
retrieval:
  top_k: 3
  rerank: true
  rerank_model: "BAAI/bge-reranker-base"

